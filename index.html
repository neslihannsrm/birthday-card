<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join my 21st birthday party! Fun, cake, and laughter await!"><!-- SEO meta -->
    <link rel="stylesheet" href="styles/index.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <title>Birthday Invitation</title>
</head>
<body>
    <div class="header__container">
        <div class="svg__smiley">
            <svg class="smiley__face" width="150" height="150" aria-hidden="true">
                <circle class="face" r="20" cx="20" cy="20" fill="#fed766"/>
                <circle class="eyeleft" r="4" cx="13" cy="14" fill="black"/>
                <circle class="eyeright" r="4" cx="27" cy="14" fill="black"/>
                <path d="M 10,25 A 10,10 0 0,0 30,25" fill="none" stroke="black" stroke-width="2" />
            </svg>
        </div>
        <h1 class="animate__animated animate__jackInTheBox">YOU ARE INVITED TO MY PARTY!</h1>
    </div>
    
    <div class="container">
        <img class="confetti" src="/images/confetti.webp" alt="Colorful confetti celebrating a party" loading="lazy">
        <img class="confetti__mirrored" src="/images/confetti-mirrored.webp" alt="Mirrored confetti design" loading="lazy">
        
        <p>I'm throwing a big party for my 21st birthday and I'd love to share this special day with you. Please join me on May 6th!</p>
        <p><strong>Date:</strong> May 6th</p>
        <p><strong>Time:</strong> 18:00</p>
        <p><strong>Location:</strong> Ljusgatan 77</p>
        <p><strong>RSVP by May 1st:</strong> <a href="mailto:neslihan@gmail.com">neslihan@gmail.com</a></p>

        <svg class="envelope" width="100" height="50" aria-hidden="true">
            <use href="images/envelope.svg#icon-envelope"></use>
        </svg>
        
        <p>There will be a delicious cake and lots of laughter!</p>
    </div>
</body>
</html>
